<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Message at Midnight — Episode 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="phone" id="drama" aria-label="Short drama player">
      <div class="sky"></div>
      <div class="moon"></div>
      <div class="stars"></div>

      <div class="topbar">
        <span class="series">THE MESSAGE AT MIDNIGHT</span>
        <span id="sceneNumber">1/5</span>
      </div>

      <div class="scene" id="scene">
        <div class="city">
          <div class="building b1"></div>
          <div class="building b2"></div>
          <div class="building b3"></div>
          <div class="building b4"></div>
        </div>

        <div class="street">
          <div class="road-line"></div>
        </div>

        <div class="character" id="character">
          <div class="head">🙂</div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="phone-hand" id="phoneHand">📱</div>
        </div>

        <div class="phone-screen" id="phoneScreen">
          <div class="phone-top">UNKNOWN NUMBER</div>
          <div class="message" id="phoneMessage">Don't go home tonight.</div>
        </div>

        <div class="speech" id="speech"></div>

        <div class="blackout" id="blackout">
          <div class="final-question">WHO WAS BEHIND HIM?</div>
          <div class="part">PART 2...</div>
        </div>
      </div>

      <div class="caption" id="caption"></div>
      <div class="voice-line" id="voiceLine"></div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="controls">
        <button id="playBtn">▶ Play</button>
        <button id="restartBtn">↻ Restart</button>
        <button id="soundBtn">🔊 Sound</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
      </div>
    </section>

    <p class="tip">For TikTok: record the player in vertical 9:16 format.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
